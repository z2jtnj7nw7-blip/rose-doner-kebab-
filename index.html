/* ==================================================
   RENDERIZAR EL MENÚ
================================================== */

const menuContainer = document.getElementById("menu");
const navContainer = document.getElementById("nav");

let cart = [];


/* ==================================================
   CREAR CATEGORÍAS
================================================== */

Object.keys(MENU).forEach(category => {

    const button = document.createElement("button");

    button.textContent = category;

    button.onclick = () => {

        document
            .getElementById(
                "section-" +
                category.replace(/\s/g, "-")
            )
            ?.scrollIntoView({
                behavior: "smooth"
            });

    };

    navContainer.appendChild(button);

});


/* ==================================================
   MOSTRAR PRODUCTOS
================================================== */

Object.entries(MENU).forEach(
([category, products]) => {

    const section = document.createElement("section");

    section.id =
        "section-" +
        category.replace(/\s/g, "-");

    const title = document.createElement("h2");

    title.textContent = category;

    section.appendChild(title);


    const grid = document.createElement("div");

    grid.className = "grid";


    products.forEach(product => {

        const card = document.createElement("article");

        card.className = "card";


        const name = product[0];

        const description = product[1];

        const price1 = product[2] || "";

        const price2 = product[3] || "";

        const price3 = product[4] || "";


        let pricesHTML = "";


        if (price1) {

            pricesHTML += `
                <span>${price1}</span>
            `;

        }


        if (price2) {

            pricesHTML += `
                <span> · ${price2}</span>
            `;

        }


        if (price3) {

            pricesHTML += `
                <span> · ${price3}</span>
            `;

        }


        card.innerHTML = `

            <h3>${name}</h3>

            <div class="desc">
                ${description || ""}
            </div>

            <div class="price">

                ${pricesHTML}

                <button
                    class="add"
                    onclick="addToCart(
                        '${escapeText(name)}',
                        '${escapeText(price1)}'
                    )">

                    +

                </button>

            </div>

        `;


        grid.appendChild(card);

    });


    section.appendChild(grid);

    menuContainer.appendChild(section);

});


/* ==================================================
   EVITAR PROBLEMAS CON COMILLAS
================================================== */

function escapeText(text) {

    return String(text)
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;");

}


/* ==================================================
   CONVERTIR PRECIO
================================================== */

function getPrice(price) {

    if (!price) return 0;

    return parseFloat(
        price
            .replace("€", "")
            .replace(",", ".")
            .trim()
    ) || 0;

}


/* ==================================================
   AÑADIR AL CARRITO
================================================== */

function addToCart(name, price) {

    const numericPrice = getPrice(price);

    if (!numericPrice) {

        alert(
            "Selecciona una opción con precio."
        );

        return;

    }


    const existing = cart.find(
        item => item.name === name
    );


    if (existing) {

        existing.qty++;

    } else {

        cart.push({

            name: name,

            price: numericPrice,

            qty: 1

        });

    }


    updateCart();

}


/* ==================================================
   ACTUALIZAR CARRITO
================================================== */

function updateCart() {

    const countElement =
        document.getElementById("count");

    const totalElement =
        document.getElementById("total");


    let total = 0;

    let count = 0;


    cart.forEach(item => {

        total +=
            item.price * item.qty;

        count += item.qty;

    });


    countElement.textContent =
        count;


    totalElement.textContent =
        total
            .toFixed(2)
            .replace(".", ",") +
        " €";


    renderCart();

}


/* ==================================================
   MOSTRAR CARRITO
================================================== */

function renderCart() {

    const cartElement =
        document.getElementById("cart");


    if (cart.length === 0) {

        cartElement.innerHTML = `

            <h3>🛒 Tu carrito</h3>

            <p>
                El carrito está vacío.
            </p>

        `;

        return;

    }


    let html = `

        <h3>🛒 Tu pedido</h3>

    `;


    cart.forEach(
        (item, index) => {

            const subtotal =
                item.price * item.qty;


            html += `

                <div class="cartrow">

                    <div>

                        <strong>
                            ${item.name}
                        </strong>

                        <br>

                        ${item.price
                            .toFixed(2)
                            .replace(".", ",")
                        } €

                    </div>


                    <div class="qty">

                        <button
                            onclick="changeQty(
                                ${index},
                                -1
                            )">

                            −

                        </button>


                        ${item.qty}


                        <button
                            onclick="changeQty(
                                ${index},
                                1
                            )">

                            +

                        </button>

                        <br>

                        <strong>
                            ${subtotal
                                .toFixed(2)
                                .replace(".", ",")
                            } €
                        </strong>

                    </div>

                </div>

            `;

        }
    );


    html += `

        <br>

        <button
            onclick="sendWhatsApp()"
            class="wa"
            style="width:100%">

            📲 PEDIR POR WHATSAPP

        </button>

        <br><br>

        <button
            onclick="clearCart()"
            style="
                width:100%;
                padding:10px;
                border:0;
                border-radius:8px;
                background:#444;
                color:white;
            ">

            🗑️ Vaciar carrito

        </button>

    `;


    cartElement.innerHTML = html;

}


/* ==================================================
   CAMBIAR CANTIDAD
================================================== */

function changeQty(index, amount) {

    cart[index].qty += amount;


    if (cart[index].qty <= 0) {

        cart.splice(index, 1);

    }


    updateCart();

}


/* ==================================================
   VACIAR CARRITO
================================================== */

function clearCart() {

    cart = [];

    updateCart();

}


/* ==================================================
   ABRIR / CERRAR CARRITO
================================================== */

document
    .getElementById("cartBtn")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById("cart")
                .classList
                .toggle("open");

        }
    );


/* ==================================================
   BUSCADOR
================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .toLowerCase()
                    .trim();


            document
                .querySelectorAll(".card")
                .forEach(card => {

                    const text =
                        card
                            .innerText
                            .toLowerCase();


                    if (
                        text.includes(search)
                    ) {

                        card.style.display =
                            "";

                    } else {

                        card.style.display =
                            "none";

                    }

                });

        }
    );


/* ==================================================
   WHATSAPP
================================================== */

function sendWhatsApp() {

    if (cart.length === 0) {

        alert(
            "El carrito está vacío."
        );

        return;

    }


    let message =
        "🍕 *PEDIDO ROS DONER KEBAB*%0A%0A";


    let total = 0;


    cart.forEach(item => {

        const subtotal =
            item.price * item.qty;


        total += subtotal;


        message +=

            "• " +
            item.name +
            " x" +
            item.qty +
            " = " +
            subtotal
                .toFixed(2)
                .replace(".", ",") +
            " €%0A";

    });


    message +=
        "%0A💰 *TOTAL: " +
        total
            .toFixed(2)
            .replace(".", ",") +
        " €*";


    /*
       CAMBIA ESTE NÚMERO
       POR EL WHATSAPP DEL LOCAL
    */

    const phone =
        "34673035749";


    const url =
        "https://wa.me/" +
        phone +
        "?text=" +
        message;


    window.open(
        url,
        "_blank"
    );

}


/* ==================================================
   INICIALIZAR
================================================== */

updateCart();

</script>

<script>

/* ==================================================
   CERRAR CARRITO AL HACER CLICK FUERA
================================================== */

document.addEventListener("click", function(event) {

    const cartElement =
        document.getElementById("cart");

    const cartButton =
        document.getElementById("cartBtn");


    if (
        cartElement.classList.contains("open") &&
        !cartElement.contains(event.target) &&
        !cartButton.contains(event.target)
    ) {

        cartElement.classList.remove("open");

    }

});


/* ==================================================
   FILTRAR PRODUCTOS POR CATEGORÍA
================================================== */

function showCategory(category) {

    const sections =
        document.querySelectorAll("main section");


    sections.forEach(section => {

        if (
            category === "Todo" ||
            section.dataset.category === category
        ) {

            section.style.display = "";

        } else {

            section.style.display = "none";

        }

    });

}


/* ==================================================
   BOTÓN TODO
================================================== */

const allButton =
    document.createElement("button");

allButton.textContent = "Todo";

allButton.classList.add("active");

allButton.onclick = () => {

    document
        .querySelectorAll("main section")
        .forEach(section => {

            section.style.display = "";

        });


    document
        .querySelectorAll("nav button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    allButton.classList.add("active");

};


/* ==================================================
   AÑADIR BOTÓN TODO AL PRINCIPIO
================================================== */

navContainer.prepend(allButton);


/* ==================================================
   BOTONES DE CATEGORÍAS
================================================== */

document
    .querySelectorAll("nav button")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll("nav button")
                    .forEach(btn => {

                        btn.classList.remove("active");

                    });


                this.classList.add("active");

            }
        );

    });


/* ==================================================
   PREPARAR CATEGORÍAS
================================================== */

document
    .querySelectorAll("main section")
    .forEach(section => {

        const title =
            section.querySelector("h2");

        if (title) {

            section.dataset.category =
                title.textContent.trim();

        }

    });


/* ==================================================
   MEJORAR BOTONES DE PRECIO
================================================== */

document
    .querySelectorAll(".card")
    .forEach(card => {

        const price =
            card.querySelector(".price");

        if (!price) return;


        const buttons =
            price.querySelectorAll(".add");


        buttons.forEach(button => {

            button.title =
                "Añadir al carrito";

        });

    });


/* ==================================================
   TECLA ESC PARA CERRAR CARRITO
================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            document
                .getElementById("cart")
                .classList
                .remove("open");

        }

    }
);


/* ==================================================
   MENSAJE INICIAL
================================================== */

console.log(
    "🍕 Ros Doner Kebab - menú cargado correctamente"
);


/* ==================================================
   FIN
================================================== */

</script>

</body>
